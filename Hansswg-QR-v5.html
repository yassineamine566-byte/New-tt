<div id="hsqExportPreview" class="hsq-export-preview" aria-hidden="true">
    <div class="hsq-export-card">

        <button id="hsqCloseExport" class="hsq-export-close" type="button">
            <i class="fas fa-xmark"></i>
        </button>

        <div class="hsq-export-quality">
            <i class="fas fa-circle-check"></i>
            <span>Ultra High Quality</span>
            <small id="hsqExportResolution">2048 × 2048</small>
        </div>

        <div class="hsq-export-art">

            <!-- Soft glass square -->
            <div class="hsq-export-glass">

                <!-- Sharp QR -->
                <div id="hsqExportQR"></div>

            </div>

            <!-- Inverted brand rectangle -->
            <div class="hsq-export-brand">
                <strong>https://hansswagQR.com</strong>
                <span>
                    Scan • Create • Share • Hansswag.QR
                </span>
            </div>

            <div class="hsq-export-meta">
                <span>
                    <i class="fas fa-shield-halved"></i>
                    Scan Safe
                </span>

                <span>
                    <i class="fas fa-wand-magic-sparkles"></i>
                    Custom Style
                </span>

                <span>
                    <i class="fas fa-certificate"></i>
                    HD Quality
                </span>
            </div>

        </div>

        <div class="hsq-export-actions">

            <button id="hsqDownloadPNG" class="btn btn-primary">
                <i class="fas fa-download"></i>
                Download PNG
            </button>

            <button id="hsqDownloadSVG" class="btn btn-outline">
                <i class="fas fa-file-code"></i>
                Download SVG
            </button>

            <button id="hsqCopyImage" class="btn btn-outline">
                <i class="fas fa-copy"></i>
                Copy
            </button>

        </div>

        <div class="hsq-export-footer">
            <span>
                <i class="fas fa-lock"></i>
                Generated locally
            </span>

            <span>
                Made with ♥ by Hansswag.QR
            </span>
        </div>

    </div>
</div>
